[package]
name = "atome_lm_rs"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["embassy"]
hal-rt = ["rp2040-hal/rt"]
host-tests = []
embassy = [
    "dep:embassy-executor",
    "dep:embassy-time",
    "dep:embassy-rp",
    "dep:embassy-sync",
]

[dependencies]
burn = { version = "=0.21.0", default-features = false, features = ["flex"] }
burn-flex = { version = "=0.21.0", default-features = false, features = ["critical-section"] }

[target.'cfg(all(target_arch = "arm", target_os = "none"))'.dependencies]
embedded-alloc = "0.6"
cortex-m = "0.7"
cortex-m-rt = "0.7"
embedded-hal = { version = "1.0.0" }
embedded_hal_0_2 = { package = "embedded-hal", version = "0.2.5", features = ["unproven"] }
defmt = "1.0"
defmt-rtt = "1.1"
panic-probe = { version = "1.0", features = ["print-defmt"] }
rp2040-hal = { version = "0.12", features = ["critical-section-impl"] }
rp2040-boot2 = "0.3"
critical-section = "1.2"
fugit = "0.3"
embedded-test = { version = "0.7", default-features = false, features = ["defmt", "semihosting"] }

# Embassy dependencies (optional, enabled via "embassy" feature)
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "defmt"], optional = true }
embassy-time = { version = "0.5", features = ["defmt"], optional = true }
embassy-rp = { version = "0.10", features = ["defmt", "rp2040", "time-driver", "critical-section-impl", "boot2-generic-03h"], optional = true }
embassy-sync = { version = "0.8", features = ["defmt"], optional = true }

[[bin]]
name = "atome_lm_rs"
test = false
required-features = ["embassy"]

[[test]]
name = "example_test"
harness = false
required-features = ["hal-rt"]

[[test]]
name = "burn_parity"
required-features = ["host-tests"]

# cargo build/run
[profile.dev]
codegen-units = 1
debug = true
debug-assertions = true
incremental = false
opt-level = 0
overflow-checks = true

# cargo build/run --release
[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 3
overflow-checks = false
